<!DOCTYPE html>
<html lang="my"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recap</title>
<style>
:root{--bg:#0a0a0b;--card:#131316;--card2:#1a1a1e;--line:#26262b;--tx:#f4f4f5;--mu:#8b8b93;--ac:#d946ef;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f4f6;--card:#fff;--card2:#ececf0;--line:#d8d8de;--tx:#111;--mu:#666;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0a0a0b;--card:#131316;--card2:#1a1a1e;--line:#26262b;--tx:#f4f4f5;--mu:#8b8b93}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Myanmar","Padauk",sans-serif;max-width:480px;margin:auto;padding:0 14px 40px}
header{display:flex;align-items:center;gap:8px;padding:14px 0;border-bottom:1px solid var(--line);position:relative}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(90deg,#ddd 50%,#666 50%)}
h1{font-size:20px;margin:0 auto 0 6px}
.pill,.ic{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:30px;height:44px;display:flex;align-items:center;padding:0 14px;gap:6px;font-size:14px}
.ic{width:44px;justify-content:center;padding:0;font-size:18px}
.av{width:44px;height:44px;border-radius:50%;background:#3b556b;border:3px solid #e11d48;color:#fff;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:16px;margin-top:16px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:30px;padding:5px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:12px;border-radius:26px;font-size:16px}
.seg button.on{background:#2c2c32;color:#fff;font-weight:600}
.drop{margin-top:14px;background:var(--card2);border-radius:26px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;color:var(--mu)}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:30px;padding:14px 26px;font-size:16px}
input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:16px;padding:14px;font-size:15px}
video{width:100%;border-radius:18px;max-height:260px}
.msg{color:var(--mu);margin:22px 4px 10px;font-size:17px}
.row2{display:flex;gap:12px}.row2 .btn{flex:1;display:flex;justify-content:center;gap:8px;border-radius:30px;font-weight:600}
.go{display:block;width:100%;margin-top:14px;border:0;border-radius:30px;padding:18px;font-size:17px;background:#1b1b1e;color:#666}
.go.ready{background:linear-gradient(90deg,#c026d3,#7c3aed);color:#fff}
.bar{height:8px;background:var(--card2);border-radius:8px;margin-top:14px;overflow:hidden;display:none}.bar i{display:block;height:100%;width:0;background:var(--ac)}
.menu{position:absolute;right:0;top:66px;width:300px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px;z-index:20;display:none;box-shadow:0 10px 40px #0008}
.menu.show{display:block}.menu small{color:var(--mu)}.menu .it{padding:12px 4px;display:flex;gap:10px}
.up{display:block;width:100%;margin:12px 0;border:0;border-radius:30px;padding:14px;color:#fff;font-size:17px;font-weight:600;background:linear-gradient(90deg,#e879f9,#a855f7)}
.sheet-bg{position:fixed;inset:0;background:#0009;display:none;z-index:30}.sheet-bg.show{display:block}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--card);border-radius:32px 32px 0 0;padding:14px 18px calc(30px + env(safe-area-inset-bottom,0px))}
.grab{width:70px;height:6px;border-radius:6px;background:var(--line);margin:0 auto 18px}
label.l{display:block;color:var(--mu);font-size:16px;margin:22px 0 10px}
select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:30px;padding:18px;font-size:16px}
.tr{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.sw{width:64px;height:36px;border-radius:30px;background:var(--card2);position:relative;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#555;transition:.2s}
.sw.on{background:#fff}.sw.on::after{left:31px;background:#111}
.badge{background:var(--card2);color:var(--mu);border-radius:20px;padding:8px 14px;font-size:14px}
.prev{background:#f4f4f6;color:#000;border-radius:28px;min-height:130px;display:flex;align-items:center;padding:0 40px;margin-top:10px}
.prev.d{background:#111;color:#fff}
input[type=range]{width:100%;accent-color:#fff}
.h{padding:12px 0;border-top:1px solid var(--line)}
</style></head><body>
<header>
<div class="logo"></div><h1>Recap</h1>
<div class="pill">⚡ အခမဲ့ <span id="cr">8</span> / 10 ခု</div>
<button class="ic" onclick="toast('အသိပေးချက် မရှိသေးပါ')">🔔</button>
<button class="ic av" id="avb">T</button>
<div class="menu" id="menu">
<small>user@example.com</small>
<div class="card" style="margin:12px 0;padding:12px;text-align:center;border-radius:22px"><b>⚡ အခမဲ့ <span id="cr2">8</span> / 10 ခု ကျန်ရှိ</b><br><small>နေ့စဉ် ဗီဒီယို ကန့်သတ်ချက်</small><button class="up">Upgrade</button></div>
<div class="it">💳 ပိုက်ဆံအိတ်နှင့် အသုံးပြုမှု</div><div class="it">⚙️ ဆက်တင်များ</div><div class="it">💬 Community အဖွဲ့</div><div class="it">📢 သတင်းထုတ်ပြန်ချက် ချန်နယ်</div><div class="it" onclick="theme()">🌙 အပြင်အဆင်</div><div class="it">🔊 Sound</div><div class="it">🌐 ဘာသာစကား</div><div class="it" style="border-top:1px solid var(--line);color:#f87171">🚪 အကောင့်ထွက်ရန်</div>
</div></header>

<div class="card">
<div class="seg" style="width:78%"><button class="on" id="tU" onclick="tab(0)">Upload</button><button id="tP" onclick="tab(1)">Paste URL</button></div>
<div class="drop" id="dU"><button class="btn" onclick="f.click()">ဗီဒီယို ရွေးချယ်ပါ</button><span>သို့မဟုတ် ဤနေရာသို့ ဆွဲထည့်ပါ</span></div>
<div class="drop" id="dP" style="display:none"><input type="text" id="url" placeholder="https://..." oninput="loadUrl(this.value)"></div>
<input type="file" id="f" accept="video/*" hidden>
</div>
<p class="msg" id="info">Load a video first.</p>
<div class="row2"><button class="btn" onclick="openS('set')">⚙️ Settings</button><button class="btn" onclick="openH()">🕘 History</button></div>
<button class="go" id="go" disabled onclick="start()">စတင်ထုတ်ယူမည်</button>
<div class="bar" id="bar"><i id="bi"></i></div>

<div class="sheet-bg" id="sb" onclick="if(event.target===this)closeS()"><div class="sheet" id="sh"></div></div>

<script>
var S={mode:'Recap',voice:'Thiha · Male (Burmese)',style:'Fast Recap',aspect:'Auto',lang:'Burmese',cap:true,capStyle:'Outline',font:'Yati Round (Modern)',scale:109,dark:false};
var FILE=null,credits=8,loaded=false,dur=90,hist=[];
try{var h=localStorage.getItem('rc_h');if(h)hist=JSON.parse(h);var c=localStorage.getItem('rc_c');if(c)credits=+c}catch(e){}
function $(i){return document.getElementById(i)}
function showCr(){$('cr').textContent=credits;$('cr2').textContent=credits}showCr();
$('avb').onclick=function(){$('menu').classList.toggle('show')};
function theme(){var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'}
function tab(n){$('tU').className=n?'':'on';$('tP').className=n?'on':'';$('dU').style.display=n?'none':'flex';$('dP').style.display=n?'flex':'none'}
function ready(){loaded=true;$('go').disabled=false;$('go').className='go ready';$('info').textContent=Math.round(dur)+'s video · ~'+Math.max(1,Math.ceil(dur/45))+' credits'}
$('f').onchange=function(){var file=this.files[0];if(!file)return;FILE=file;var v=document.createElement('video');v.src=URL.createObjectURL(file);v.controls=true;v.onloadedmetadata=function(){dur=v.duration||90;ready()};$('dU').innerHTML='';$('dU').appendChild(v)};
function loadUrl(u){toast('Paste URL မရသေးပါ၊ Upload သုံးပါ')}
function toast(t){$('info').textContent=t}
function opt(a,v){return a.map(function(x){return '<option'+(x===v?' selected':'')+'>'+x+'</option>'}).join('')}
function sel(k,a,l){return '<label class="l">'+l+'</label><select onchange="S.'+k+'=this.value">'+opt(a,S[k])+'</select>'}
function tg(k,l){return '<div class="tr"><span>'+l+'</span><button class="sw'+(S[k]?' on':'')+'" onclick="S.'+k+'=!S.'+k+';openS(1)"></button></div>'}
function seg(k,a){return '<div class="seg" style="margin:10px 0">'+a.map(function(x){return '<button class="'+(S[k]===x?'on':'')+'" onclick="S.'+k+'=\''+x+'\';openS(1)">'+x+'</button>'}).join('')+'</div>'}
function openS(keep){var sc=$('sh').scrollTop;var x='<div class="grab"></div><label class="l" style="margin-top:0">What to make</label>'+seg('mode',['Recap','Translate'])+
sel('voice',['Thiha · Male (Burmese)','Nilar · Female (Burmese)'],'Voice')+
sel('style',['Fast Recap','Story Mode','Dramatic','Summary'],'Script style')+
sel('aspect',['Auto','9:16','16:9','1:1'],'Aspect')+
sel('lang',['Burmese','English','Thai','Chinese'],'Language')+
tg('cap','Captions')+
'<div class="tr" style="border:0"><b>Preview sample text</b><button class="badge" onclick="S.dark=!S.dark;openS(1)">'+(S.dark?'🌙':'☀️')+'</button></div><div class="prev'+(S.dark?' d':'')+'" style="font-size:'+(28*S.scale/109)+'px;font-weight:600">ဒီနေရာမှာ စာတန်းထိုး ပေါ်...</div>'+
'<label class="l">Scale <span style="float:right;color:var(--tx)">'+S.scale+'%</span></label><input type="range" min="60" max="160" value="'+S.scale+'" onchange="S.scale=this.value;openS(1)">';
$('sh').innerHTML=x;$('sb').classList.add('show');if(keep)$('sh').scrollTop=sc}
function closeS(){$('sb').classList.remove('show')}
function openH(){var x='<div class="grab"></div><b style="font-size:18px">History</b>'+(hist.length?hist.map(function(i){return '<div class="h">🎬 '+i.n+'<br><small style="color:var(--mu)">'+i.d+' · '+i.s+'</small></div>'}).join(''):'<p style="color:var(--mu)">မှတ်တမ်း မရှိသေးပါ</p>');$('sh').innerHTML=x;$('sb').classList.add('show')}
function start(){if(!FILE){toast('ဗီဒီယို အရင်ရွေးပါ');return}
if(credits<1){toast('Credits ကုန်သွားပါပြီ');return}
$('go').disabled=true;$('bar').style.display='block';$('bi').style.width='5%';$('go').textContent='တင်နေသည်... (ပထမဆုံးဆို ၁ မိနစ်စောင့်ရနိုင်)';
var fd=new FormData();fd.append('video',FILE);fd.append('settings',JSON.stringify({mode:S.mode,voice:S.voice,style:S.style,aspect:S.aspect,lang:S.lang,cap:S.cap,scale:S.scale}));
fetch('/api/jobs',{method:'POST',body:fd}).then(function(r){if(!r.ok)throw new Error('upload '+r.status);return r.json()}).then(function(j){poll(j.job_id)}).catch(fail)}
function poll(id){var t=setInterval(function(){fetch('/api/jobs/'+id).then(function(r){return r.json()}).then(function(s){
$('bi').style.width=(s.progress||5)+'%';$('go').textContent=s.status+' '+(s.progress||0)+'%';
if(s.status==='done'){clearInterval(t);done(id)}else if(s.status==='error'){clearInterval(t);fail(new Error(s.error))}else if(s.status==='not_found'){clearInterval(t);fail(new Error('job မတွေ့ပါ'))}}).catch(function(){})},3000)}
function rst(){$('go').textContent='စတင်ထုတ်ယူမည်';$('go').disabled=false;$('bar').style.display='none'}
function done(id){credits--;showCr();hist.unshift({n:FILE.name.slice(0,40),s:S.mode+' · '+S.lang,d:new Date().toLocaleString()});
try{localStorage.setItem('rc_h',JSON.stringify(hist));localStorage.setItem('rc_c',credits)}catch(e){}
rst();$('info').innerHTML='<a style="color:#d946ef;font-size:18px" href="/api/jobs/'+id+'/result" download="recap.mp4">⬇️ recap.mp4 ဒေါင်းလုဒ်လုပ်ပါ</a>'}
function fail(e){rst();toast('Error: '+e.message)}
</script></body></html>
